<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Method</title>
<style>/*CSS*/</style>
<style>
.mp{max-width:1180px;grid-template-columns:minmax(0,1fr);margin:0 auto;padding:0 20px 32px;display:grid;gap:14px}
.mp .card h2{font-size:17px;margin:0 0 8px}
.mp .card h3{font-size:14px;margin:14px 0 6px}
.mp p{margin:6px 0;max-width:82ch;line-height:1.55}
.mp ul{margin:6px 0;padding-left:20px;max-width:86ch}.mp li{margin:4px 0;line-height:1.5}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:12.5px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
.flow .st{border:1px solid var(--border);border-radius:10px;padding:10px 12px;position:relative}
.flow .st b{display:block;font-size:13px;margin-bottom:3px}
.flow .st span{font-size:12.5px;color:var(--ink2);line-height:1.45;display:block}
.flow .st i{position:absolute;top:8px;right:10px;font-style:normal;color:var(--muted);font-size:12px}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dim{border:1px solid var(--border);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px}
.dim h3{margin:0 0 2px;color:var(--ink)}
.dim .q{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.dim .use{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.mt{width:100%;border-collapse:collapse;font-size:12.5px}
table.mt th{text-align:left;font-weight:500;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--border)}
table.mt td{padding:5px 6px;border-bottom:1px solid var(--grid);vertical-align:top;text-align:left;white-space:normal}
table.mt th.n,table.mt td.n{text-align:right}
table.mt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dim table.mt td:first-child{width:62%}
.tgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.tree{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-items:center}
.tree .q{color:var(--muted);font-size:12px}
.small{font-size:12px;color:var(--muted)}
table.fields td{font-size:12px;line-height:1.4}
table.fields tr.grp td{font-weight:600;font-size:12.5px;background:var(--wash);padding-top:8px}
table.fields code{font-size:11px;color:var(--muted)}
.mp{max-width:1400px}
span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px}
@media (max-width:900px){.flow{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="Method">Method</h1>
    <p class="sub" id="sub"></p>
    <nav class="nav"></nav>
  </div>
  <div class="top-actions">
    <span class="seg" id="lang"></span>
    <button type="button" id="theme-btn" class="ghost" data-i18n="Theme">Theme</button>
  </div>
</header>
<main class="mp" id="mp"></main>
<div id="tip" role="tooltip"></div>
<script>/*D3*/</script>
<script>/*DATA*/</script>
<script>/*JS*/</script>
</body>
</html>
