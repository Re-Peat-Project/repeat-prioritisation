<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peat KHG priority</title>
<style>/*MLCSS*/</style>
<style>/*CSS*/</style>
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="Peat KHG priority">Peat KHG priority</h1>
    <p class="sub" id="sub"></p>
    <nav class="nav"><a class="on" href="dashboard.html" data-i18n="KHG priority">KHG priority</a><a id="nav-fire" href="fire.html" data-i18n="Fire by land status">Fire by land status</a></nav>
  </div>
  <div class="top-actions">
    <span class="seg" id="lang"></span>
    <button type="button" id="export-btn" class="ghost" data-i18n="Export data">Export data</button>
    <button type="button" id="notes-btn" class="ghost" data-i18n="Notes">Notes</button>
    <button type="button" id="theme-btn" class="ghost" data-i18n="Theme">Theme</button>
  </div>
</header>

<section class="card final" id="final" aria-label="Final prioritisation">
  <div class="card-h"><div><h2 data-i18n="Final prioritisation">Final prioritisation</h2><p class="hint" id="final-sub"></p></div></div>
  <div class="final-top">
    <div><h3 data-i18n="Urgency against complexity">Urgency against complexity</h3><div id="final-matrix"></div></div>
    <div><h3 data-i18n="Types">Types</h3><div id="final-types"></div></div>
    <div><h3 data-i18n="Validation and stability">Validation and stability</h3><div class="kpis one" id="final-kpis"></div></div>
  </div>
  <div class="final-ctl"><span id="final-ctl"></span><span class="hint" id="final-count"></span></div>
  <div id="final-table" class="tablewrap"></div>
</section>

<section class="bar" id="filters" aria-label="Filters">
  <div class="ctl"><span class="lab" data-i18n="Presets">Presets</span><span id="presets" class="seg"></span></div>
  <div class="ctl"><span class="lab" data-i18n="Min peat">Min peat</span><input type="range" id="minpeat" min="0" max="500" step="5"><output id="minpeat-o"></output></div>
  <div class="ctl"><span class="lab" data-i18n="Island">Island</span><span id="islands" class="seg"></span></div>
  <div class="ctl"><span class="lab" data-i18n="No canals mapped">No canals mapped</span><span id="missing" class="seg"></span></div>
  <div class="ctl"><span class="lab" data-i18n="Hotspot confidence">Hotspot confidence</span><span id="conf" class="seg"></span></div>
  <div class="ctl"><span class="lab" data-i18n="List">List</span><span id="view" class="seg"></span></div>
</section>

<main class="grid">
  <aside class="card" id="controls"><h2 data-i18n="Weights">Weights</h2><div id="sliders"></div>
    <button type="button" id="reset" class="ghost wide" data-i18n="Reset weights">Reset weights</button>
  </aside>

  <section class="card" id="rank">
    <div class="card-h"><h2 id="rank-title">Ranking</h2>
      <span class="seg" id="rank-mode"></span></div>
    <div class="legend-row" id="rank-legend"></div>
    <div id="rank-list" class="rank-list"></div>
    <div id="rank-table" class="tablewrap" hidden></div>
  </section>

  <section class="side">
    <div class="card" id="mapcard">
      <div class="card-h"><h2 data-i18n="Map">Map</h2><span class="seg" id="zoom-btns"></span></div>
      <div class="map-tools" id="map-tools"></div>
      <div id="map" role="img" aria-label="Map of KHG coloured by score"></div>
      <div class="map-legend" id="map-legend"></div>
    </div>
    <div class="card" id="bumpcard">
      <div class="card-h"><h2 data-i18n="Rank shift">Rank shift</h2><span class="hint" id="bump-hint"></span></div>
      <svg id="bump" role="img" aria-label="Rank at default weights against rank at your weights"></svg>
    </div>
  </section>
</main>

<section class="card profile" id="profile">
  <div class="card-h"><div><h2 id="p-name">Profile</h2><div class="chips" id="p-chips"></div></div>
    <div class="pickrow"><label class="pick"><span data-i18n="KHG">KHG</span> <select id="p-pick"></select></label>
    <label class="pick"><span data-i18n="Compare with">Compare with</span> <select id="p-cmp"></select></label></div></div>
  <div class="pfinal" id="p-final"></div>
  <div class="kpis" id="p-kpis"></div>
  <div class="map-tools" id="p-tools"></div>
  <div class="p-maps" id="p-maps">
    <div class="p-mapc"><div class="mcap" id="p-cap"></div><div id="p-map"></div></div>
    <div class="p-mapc" id="p-mapc2" hidden><div class="mcap" id="p-cap2"></div><div id="p-map2"></div></div>
  </div>
  <div class="legend-row" id="p-ov-leg"></div><div class="foot" id="p-foot"></div>
  <div class="p-mid">
    <div class="p-left"><div id="p-strips"></div><div class="charts" id="p-charts"></div></div>
    <div id="p-ov-panel" class="ovp"></div>
  </div>
  <details class="data"><summary data-i18n="Data table">Data table</summary><div id="p-table" class="tablewrap"></div></details>
</section>

<dialog id="notes"><div class="dlg">
  <button type="button" class="ghost close" id="notes-close" data-i18n="Close">Close</button>
  <h2 data-i18n="Notes">Notes</h2><ul id="notes-list"></ul>
</div></dialog>

<dialog id="export"><div class="dlg">
  <button type="button" class="ghost close" id="export-close" data-i18n="Close">Close</button>
  <h2 data-i18n="Export data">Export data</h2><p class="hint" id="export-note"></p>
  <ul id="export-list" class="exportl"></ul>
  <button type="button" id="export-all" class="wide" data-i18n="Download all">Download all</button>
</div></dialog>

<div id="tip" role="tooltip"></div>
<!--CSVDATA-->
<script>/*D3*/</script>
<script>/*ML*/</script>
<script>/*PMT*/</script>
<script>/*DATA*/</script>
<!--PROFILES-->
<script>/*JS*/</script>
</body>
</html>
