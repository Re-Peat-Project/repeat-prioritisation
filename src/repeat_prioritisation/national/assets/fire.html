<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire by land status</title>
<style>/*CSS*/</style>
<style>
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
:root[data-theme=dark]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}
.fp{display:grid;gap:12px;padding:0 16px 16px}
.fk{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.fk .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.fk .kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.fk .kpi .l{margin-top:auto}
.row2{display:grid;gap:12px;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.row3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.row2b{display:grid;gap:12px;grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.col{display:flex;flex-direction:column;gap:12px}.col>.card{flex:1}
.viz h2{margin:0 0 2px}.viz .hint{margin-bottom:6px}.viz svg{display:block;width:100%;height:auto}
.slider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}.slider input{flex:1;accent-color:var(--s2)}
.slider button{padding:2px 10px}
.viz text{font-family:inherit}
:root{--q1:#f4a172;--q2:#d9592a;--q3:#a8410f;--q4:#6e2a08}
.mx{flex:1;grid-template-rows:auto 1fr 1fr;display:grid;gap:6px;grid-template-columns:minmax(7rem,auto) repeat(3,minmax(0,1fr));font-size:12px}
.mx .cell{border:1px solid var(--border);border-radius:8px;padding:8px;font-variant-numeric:tabular-nums}
.mx .cell .d{font-size:18px;font-weight:600}
.mx .h{color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.ct{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.ct th:first-child{width:28%}table.ct th:last-child{width:20%}
table.ct th{font-weight:400;color:var(--muted);text-align:right;padding:2px 4px;vertical-align:bottom;white-space:normal;position:static}
table.ct td{text-align:right;padding:4px;border-top:1px solid var(--grid);font-variant-numeric:tabular-nums}
table.ct th:first-child,table.ct td:first-child{text-align:left}
.bar0{display:flex;align-items:center;gap:6px;white-space:nowrap}.bar0 i{display:block;height:10px;border-radius:0 4px 4px 0}
.chart svg{width:100%;height:220px;display:block}
.chart .ttl{font-weight:600;font-size:13px;margin-bottom:2px}
.chart .lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-bottom:4px}
.ptab{max-height:520px;overflow:auto}
.ptab table{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{cursor:pointer;text-align:right;padding:4px;white-space:nowrap}
.ptab td{text-align:right;padding:3px 4px;border-top:1px solid var(--grid);font-variant-numeric:tabular-nums}
.ptab th:nth-child(-n+2),.ptab td:nth-child(-n+2){text-align:left}
.ptab tr.sel td{background:var(--wash)}
.ptab tbody tr{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin:4px 0 0}
.shares{margin-top:14px;display:grid;gap:8px}
.srow{display:grid;grid-template-columns:9rem 1fr;align-items:center;gap:8px;font-size:12.5px}
.sbar{display:flex;gap:2px;height:22px}
.sbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px;font-weight:600;min-width:2px;border-radius:3px}
.row2>.card{display:flex;flex-direction:column}
.fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;padding:10px 16px}
.fbar .ctl{display:flex;flex-direction:column;gap:4px}
.fbar .stamp{margin-left:auto;font-size:12px;color:var(--muted)}
@media (max-width:1200px){.fk{grid-template-columns:repeat(3,minmax(0,1fr))}.row2,.row3,.row2b{grid-template-columns:1fr}}
@media (max-width:640px){.fk{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="Fire by land status">Fire by land status</h1>
    <p class="sub" id="sub"></p>
    <nav class="nav"><a id="nav-rank" href="dashboard.html" data-p="dashboard.html" data-i18n="KHG priority">KHG priority</a><a href="khg_table.html" data-p="khg_table.html" data-i18n="KHG table">KHG table</a><a class="on" href="fire.html" data-i18n="Fire by land status">Fire by land status</a><a href="method.html" data-p="method.html" data-i18n="Method">Method</a></nav>
  </div>
  <div class="top-actions">
    <span class="seg" id="lang"></span>
    <button type="button" id="theme-btn" class="ghost" data-i18n="Theme">Theme</button>
  </div>
</header>
<section class="fbar card" id="filters" aria-label="Filters"></section>
<main class="fp">
  <div class="fk" id="kpis"></div>
  <div class="row2">
    <section class="card viz" id="v-donut"></section>
    <section class="card viz" id="v-land"></section>
  </div>
  <div class="row2">
    <section class="card viz" id="v-mosaic"></section>
    <section class="card"><div class="card-h"><h2 id="cls-title"></h2><span class="seg" id="splits"></span></div><div id="cls"></div><div class="note" id="cls-note"></div></section>
  </div>
  <section class="card viz" id="v-heat"></section>
  <div class="row2">
    <section class="card viz chart" id="c-month"></section>
    <section class="card viz" id="v-times"></section>
  </div>
  <section class="card"><div class="card-h"><h2 data-i18n="By province">By province</h2><input type="search" id="psearch" placeholder="Search province"></div>
    <div class="hint" id="p-hint"></div><div class="ptab" id="ptab"></div></section>
  <p class="note" id="foot"></p>
</main>
<div id="tip" role="tooltip"></div>
<script>/*D3*/</script>
<script>/*DATA*/</script>
<script>/*JS*/</script>
</body>
</html>
