# Sub-KHG scoring on a small Riau KHG (72), hexagon units, from a prefetched 2021 cache in tests/fixtures/prefetched/72.
#   repeat-subkhg --config configs/smoke/subkhg.yaml --skip-fetch
# Without --skip-fetch it fetches the 2021 layers first (about 1 minute; ERA5 rainfall is off for sub-KHG runs).
khg: tests/fixtures/khg_small.gpkg
khg_id_field: khg_id
khg_filter: ["72"]
units: {mode: hex, hex_area_km2: 1.0}
years: {baseline: [2021, 2021], validation: [], elnino: []}
cache_dir: tests/fixtures/prefetched
out: var/out/smoke/subkhg
maps: true
