# National ranking of three small KHG, 2021 only. Fetches its layers (about 3 minutes); rainfall is off to keep it fast.
#   repeat-national-run --config configs/smoke/national.yaml
khg: tests/fixtures/khg_small.gpkg
khg_id_field: khg_id
years: {baseline: [2021, 2021], validation: [], elnino: []}
sources:
  era5: {enabled: false}
cache_dir: var/cache/smoke
out: var/out/smoke/national
maps: false
