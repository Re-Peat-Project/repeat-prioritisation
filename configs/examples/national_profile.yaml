# National KHG profile and ranking from local layers: repeat-national-profile --config configs/examples/national_profile.yaml
# Environment: REPEAT_DATA (the _data folder), REPEAT_WORK (outputs), REPEAT_HUB (the re-peat repository),
# SITMAT_PROCESSED (repeat-sitmat/sitmat_out/processed). Weights are provisional: agree them with the team.
data: ${REPEAT_DATA}
out: ${REPEAT_WORK}/national_profile
registry: ${REPEAT_HUB}/sites/khg_registry.csv      # python tools/parse_kepmen_khg.py in re-peat
years:
  baseline: [2015, 2022]      # indicators; `--mode operational` extends it to the end of `validation`
  validation: [2023, 2025]    # held-out years in `--mode validate`
now:                                     # KLH-curated current-year hotspots (MODIS, monthly layers; _data_hotspot_Januari_September_2026.gpkg)
  levels: [medium, high]                 # Rendah/Low dropped; Sedang/Medium and Tinggi/High kept
  year: 2026
hotspots: {confidence: [n, h], types: [0]}   # FIRMS VIIRS: drop low confidence (l) and non-vegetation-fire types
peat:
  extent: ${REPEAT_DATA}/peat/ppeg_lahan_gambut_2026_30m.tif   # KLH peat (PPEG LAHAN_GAMB, April 2026) on the fire tally's 30 m grid: repeat-national-ppeg --layers, then --peat-raster <this config>
  vector: ${REPEAT_DATA}/peat/ppeg_lahan_gambut_2026.gpkg       # the same peat as polygons (native copy), drawn on the dashboard map
  gfw: ${REPEAT_DATA}/peat_extent_gfw_v20230315_z11.tif        # GFW composite (Miettinen 2016 + Gumbricht 2017): cross-check only
  global: ${REPEAT_DATA}/peat_extent_gpm2022_1km.tif   # Global Peatland Map 2.0, 1 km: independent cross-check (non-commercial licence)
  basis: peat            # fire counted on peat only and divided by peat area; 'area' = per km2 of KHG, all land
  min_peat_km2: 25       # KHG with less peat are profiled but not ranked
min_area_km2: 50    # smaller KHG are profiled but not ranked: a handful of detections gives a huge density
tma: {path: "${SITMAT_PROCESSED}", threshold_m: 0.4, min_days: 30}
indicators:
  u_fire_freq: {weight: 2.0}
  u_burn_repeat: {weight: 1.0}
  u_hotspot: {weight: 1.0}
  u_frp: {weight: 0.0}
  u_canal_density: {weight: 0.0}   # all canals together: reported, not scored
  u_canal_primary: {weight: 0.5}   # canal km per km2 of KHG, by class (KODE_KANAL 1, 2, 3); the three weights add to 1, as the single canal weight did
  u_canal_secondary: {weight: 0.3}
  u_canal_tertiary: {weight: 0.2}
  u_hotspot_now: {weight: 1.0}   # this year's hotspots (KLH, Jan-Sep 2026), per km2 of peat; its own weight (0 drops it); standalone rank: peringkat_now
  u_burned_now: {weight: 0.0}    # this year's burned share of the peat: reported, not scored
  i_peat_depth: {weight: 0.0}   # peat map covers 89 of 865 KHG: reported, not scored
tenure_complexity:        # repeat-national-tenure-complexity; see the module docstring for the rule and its history
  version: 2              # v2 written 2026-11-16 after the v1 national result (kept in tenure_complexity_v1/) and before any v2 result
  indicators: [c_licence_community, c_contested, c_claims_mean, c_holders]
  weights: equal          # index = mean of the indicators' percentile ranks; provisional, agree with the team
  min_peat_km2: 25        # smaller KHG get the indicators but no index
  written: "2026-11-16"
  layers:                 # python -m repeat_common.fetch_tenure_layers
    hutan_desa: tenure/hutan_desa.gpkg
    htr: tenure/htr.gpkg
    pptpkh: tenure/pptpkh.gpkg
    pelepasan: tenure/pelepasan.gpkg
final:                    # repeat-national-final: four dimensions, typology, validation; rule written 2026-11-17 before any result
  written: "2026-11-17"
  min_peat_km2: 25        # scoring pool: KHG with at least this much KLH peat (as tenure_complexity)
  score_all_337_with_peat: true   # amendment 2026-11-17 after the first run: the 337 below min_peat_km2 are scored against the pool (flagged)
  dimensions:             # indicators: weight, direction (+ = more of it raises the score); score = weighted mean of percentile ranks
    urgency:
      u_fire_freq: {weight: 2}        # mean annual burned share of peat, 2015-2025
      u_burn_repeat: {weight: 1}      # share burned twice or more
      u_hotspot: {weight: 1}          # VIIRS hotspots per km2 of peat per year, 2012-2025
      u_hotspot_now: {weight: 1}      # this year's hotspots per km2 of peat
      damage_share: {weight: 1}       # SKEG 2024 damaged share of peat (PPEG priority area)
      canal_share: {weight: 1}        # canal-affected share of peat (PPEG KET_KANAL)
    stake:
      thick3m_share: {weight: 1}      # peat 3 m or deeper
      dome_share: {weight: 1}         # BBSDLP dome landform
      protected_share: {weight: 1}    # protected peat ecosystem function
      peat_km2: {weight: 1}           # peat area (carbon at stake)
    complexity:
      tenure_complexity: {weight: 2}  # tenure complexity v2
      actor_types: {weight: 1}        # actor types holding priority area: company, company buffer, Ministry of Forestry, KLH
      villages: {weight: 1}           # Bluebook target villages + DMPG villages
    feasibility:
      dry_balance_mm: {weight: 1}     # dry-season P - E (higher = less shortfall)
      brgm_blocks_per_km2: {weight: 1}   # existing BRGM structures per km2 of peat
  validation: {target: u_burned_now, exclude: [u_hotspot_now]}   # urgency without 2026 hotspots against the 2026 burned share of peat
  sensitivity: {runs: 500, seed: 20261117}   # every weight times U(0.5, 1.5)
fire_landstatus:          # repeat-national-fire: burned area and hotspots by concession, forest area and DMPG over all of Indonesia
  crs: EPSG:6933          # equal-area grid, so every cell has the same area
  cell_m: 30
  tile_cells: 3000        # 90 km tiles, cached and resumable
  years: [2015, 2026]     # burnt-area flags BA_yyyy (KLHK)
  villages: batas_desa_indonesia_2023_KLH.gpkg     # land mask, province and district
  modis: hotspots_modis_2026.gpkg                  # this year's headline series (KLH, then FIRMS MODIS NRT)
  viirs: [hotspot_viirs_snpp_2012_2025.gpkg, hotspot_viirs_snpp_sp_2026.gpkg, hotspot_viirs_snpp_nrt_2026.gpkg]
  static_radius_m: {modis: 1000, viirs: 375}       # untyped hotspots this close to a VIIRS volcano/static/offshore detection are flagged static
